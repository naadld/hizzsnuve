name = "historysnooze-gateway"
main = "worker_gateway.js"
compatibility_date = "2026-08-14"

[vars]
GITHUB_REPO = "naadld/hizzsnuve"

# Cloudflare Workers AI Free Tier Binding (10,000 daily free Neurons)
[ai]
binding = "AI"

# Environment Secrets to set via wrangler or Cloudflare Dashboard:
# 1. GEMINI_KEY_1 ... GEMINI_KEY_6 (6-Key Gemini API Rotation Pool)
# 2. GITHUB_PAT (GitHub Personal Access Token for naadld/hizzsnuve)
# 3. EXTRA_AI_KEY_1 ... EXTRA_AI_KEY_4 (Optional 4 external AI API keys like Groq, DeepSeek, OpenAI)
